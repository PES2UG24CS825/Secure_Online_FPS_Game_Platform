<!doctype html>
<html lang="en">
<head>
  <script>if (["3000", "5500"].includes(window.location.port)) { window.location.replace(`http://${window.location.hostname}:5000${window.location.pathname.replace(/^\/frontend/, "")}${window.location.search}`); }</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>SecureFPS | Reset password</title>
  <link rel="icon" type="image/svg+xml" href="public/securefps-mark.svg?v=2">
  <link rel="stylesheet" href="css/styles.css?v=20261124_restore9">
  <link rel="stylesheet" href="css/ui-polish.css?v=20261124_restore9">
</head>
<body class="auth-page">
  <main class="auth-shell single">
    <section class="auth-card">
      <div class="card-head">
        <p class="eyebrow">PLAYER ACCOUNT</p>
        <h2>Choose a new password</h2>
        <p>Update your player password securely.</p>
      </div>
      <form id="resetForm" class="form">
        <label>New password<div class="password-field"><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Uppercase, number, special character"><button class="password-toggle" type="button" data-password-target="newPassword" aria-label="Show password" title="Show password">&#128065;</button></div></label>
        <label>Confirm password<div class="password-field"><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Re-enter password"><button class="password-toggle" type="button" data-password-target="confirmPassword" aria-label="Show password" title="Show password">&#128065;</button></div></label>
        <button class="primary-btn" type="submit">Update password <span>→</span></button>
      </form>

      <div id="message" class="message" aria-live="polite"></div>
      <p class="switch"><a href="login.html">Back to sign in</a></p>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
  <script src="js/password-toggle.js"></script>
</body>
</html>
