<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SecureFPS | Forgot Password</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell single">
    <section class="auth-card">
      <div class="card-head">
        <p class="eyebrow">PLAYER ACCOUNT</p>
        <h2>Reset password</h2>
        <p>Enter your player email to request reset instructions.</p>
      </div>
      <form id="forgotForm" class="form">
        <label>Email<input id="email" type="email" autocomplete="email" required placeholder="player@example.com"></label>
        <button class="primary-btn" type="submit">Request reset <span>→</span></button>
      </form>
      <div id="message" class="message"></div>
      <p class="switch"><a href="login.html">Back to sign in</a></p>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
