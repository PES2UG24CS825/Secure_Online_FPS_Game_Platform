<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SecureFPS | Forgot Password</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell single">
    <section class="auth-card">
      <div class="card-head">
        <p class="eyebrow">PLAYER ACCOUNT</p>
        <h2>Reset password</h2>
        <p>Use this local demo form to update your player password.</p>
      </div>
      <form id="forgotForm" class="form">
        <label>Email<input id="email" type="email" autocomplete="email" required placeholder="player@example.com"></label>
        <label>New password<div class="password-field"><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Uppercase, number, special character"><button class="password-toggle" type="button" data-password-target="newPassword" aria-label="Show password" title="Show password">&#128065;</button></div></label>
        <label>Confirm password<div class="password-field"><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Re-enter password"><button class="password-toggle" type="button" data-password-target="confirmPassword" aria-label="Show password" title="Show password">&#128065;</button></div></label>
        <button class="primary-btn" type="submit">Update password <span>→</span></button>
      </form>
      <div id="message" class="message"></div>
      <p class="switch"><a href="login.html">Back to sign in</a></p>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
  <script src="js/password-toggle.js"></script>
</body>
</html>
