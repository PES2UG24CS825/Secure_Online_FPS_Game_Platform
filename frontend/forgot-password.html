<!doctype html>
<html lang="en">
<head>
  <script>if (["3000", "5500"].includes(window.location.port)) { window.location.replace(`http://${window.location.hostname}:5000${window.location.pathname.replace(/^\/frontend/, "")}${window.location.search}`); }</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SecureFPS | Forgot Password</title>
  <link rel="icon" type="image/svg+xml" href="public/securefps-mark.svg?v=2">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/ui-polish.css">
</head>
<body class="auth-page">
  <main class="auth-shell single">
    <section class="auth-card">
      <div class="card-head">
        <p class="eyebrow">PLAYER ACCOUNT</p>
        <h2>Request a password reset</h2>
        <p>Enter the email on your account to receive a reset link.</p>
      </div>
      <form id="forgotForm" class="form">
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <button class="primary-btn" type="submit">Send reset link</button>
      </form>
      <div id="message" class="message" aria-live="polite"></div>
      <p class="switch"><a href="login.html">Back to sign in</a></p>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
  <script src="js/password-toggle.js"></script>
</body>
</html>
