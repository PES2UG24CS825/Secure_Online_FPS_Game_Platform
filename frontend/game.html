<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FPS Microgame | Secure FPS Platform</title>
    <link rel="icon" type="image/svg+xml" href="public/securefps-mark.svg?v=2">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/ui-polish.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #DEDCEE;
            color: #1B1730;
            font-family: Inter, system-ui, sans-serif;
        }

        .header {
            position: relative;
            z-index: 5;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(16px, 3vw, 32px);
            background: rgba(249, 248, 253, .94);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #C3BFE0;
        }

        .header h2 {
            margin: 0;
            font-size: 17px;
            letter-spacing: -.02em;
        }

        .game-brand { display:flex; align-items:center; gap:12px; }
        .game-brand img { width:190px; max-width:42vw; height:auto; object-fit:contain; }

        .back-button {
            min-height: 40px;
            padding: 0 15px;
            border: 1px solid #C3BFE0;
            border-radius: 9px;
            cursor: pointer;
            background: #F4F1FC;
            color: #4C1D95;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            transition: transform .18s ease, background .18s ease, border-color .18s ease;
        }

        .back-button:hover { background: #EAE3F8; border-color: #A99BD5; transform: translateY(-1px); }
        .back-button:disabled { opacity: .6; cursor: wait; transform: none; }

        .leave-warning {
            position: fixed;
            z-index: 2100;
            top: 76px;
            left: 50%;
            transform: translateX(-50%);
            width: min(560px, calc(100vw - 32px));
            box-sizing: border-box;
            padding: 12px 16px;
            border: 1px solid #E8CFAA;
            border-left: 5px solid #B45309;
            border-radius: 11px;
            background: #F6EBD8;
            color: #713F12;
            box-shadow: 0 8px 22px rgba(27, 23, 48, .12);
            font-size: 12px;
            font-weight: 700;
            line-height: 1.5;
        }

        .leave-warning[hidden] { display: none; }

        .game-wrapper {
            width: 100%;
            height: calc(100dvh - 64px);
            min-height: 320px;
            padding: 12px clamp(12px, 2vw, 24px) 18px;
        }

        .game-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #D6D3EA;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #C3BFE0;
            box-shadow: 0 12px 32px rgba(35, 25, 67, .10);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .game-status {
            min-height: 100%;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #53507A;
            text-align: center;
        }

        dialog.app-alert-dialog { width: min(520px, calc(100vw - 32px)); border-radius: 16px; }
        dialog.app-alert-dialog .app-alert-content { padding: 24px; }
        dialog.app-alert-dialog .app-alert-title { display:flex; align-items:center; gap:10px; font-size:18px; }
        dialog.app-alert-dialog[data-tone="warning"] .app-alert-title::before { content:"!"; display:grid; place-items:center; width:32px; height:32px; flex:0 0 32px; border-radius:10px; background:#F6EBD8; color:#92400E; font-size:17px; }
        dialog.app-alert-dialog .app-alert-message { margin-top:12px; font-size:13px; line-height:1.6; }
        dialog.app-alert-dialog .app-alert-actions { display:grid; grid-template-columns:repeat(2,minmax(112px,140px)); justify-content:end; gap:9px; }
        dialog.app-alert-dialog .app-alert-actions button { width:100%; min-width:0; min-height:42px; white-space:nowrap; }
        dialog.app-alert-dialog .app-alert-actions button.ghost-btn { border:1px solid #C3BFE0; background:#F7F5FC; color:#4C1D95; }
        dialog.app-alert-dialog .app-alert-actions button.ghost-btn:hover { background:#EAE3F8; }
        dialog.app-alert-dialog .app-alert-actions button.primary-btn { border:1px solid #4C1D95; background:#4C1D95; color:#fff; }
        dialog.app-alert-dialog .app-alert-actions button.primary-btn:hover { background:#3E197B; }

        @media (max-width: 600px) {
            .header { height:58px; }
            .game-wrapper { height:calc(100dvh - 58px); padding:8px; }
            .leave-warning { top:66px; padding:10px 12px; font-size:11px; }
            dialog.app-alert-dialog .app-alert-content { padding:20px; }
        }
    </style>
</head>

<body>

    <div class="leave-warning" id="leaveWarning" role="alert" aria-live="assertive" hidden>
        Leaving an unfinished match gives no coins or XP and lowers Honour by 10. You can still start another match afterward.
    </div>

    <div class="header">
        <div class="game-brand">
            <img src="public/securefps-logo-crop.png?v=1" alt="SecureFPS Gaming Security">
            <h2>FPS Microgame</h2>
        </div>

        <button class="back-button" id="backToDashboard" type="button">
            ← Dashboard
        </button>
    </div>

    <div class="game-wrapper">
        <div class="game-container">
            <iframe
                id="gameFrame"
                title="FPS Microgame"
                allow="fullscreen">
            </iframe>
            <div class="game-status" id="gameStatus" role="status">
                Creating a secure game session...
            </div>
        </div>
    </div>

    <script>
        const gameFrame = document.getElementById("gameFrame");
        const gameStatus = document.getElementById("gameStatus");
        const backButton = document.getElementById("backToDashboard");
        const leaveWarning = document.getElementById("leaveWarning");
        let gameSessionId = null;
        let ending = false;
        let confirmingLeave = false;
        let ended = false;

        async function finishGame() {
            if (ending || confirmingLeave) return;
            confirmingLeave = true;
            leaveWarning.hidden = false;
            const confirmed = await window.showAppConfirm(
                "If this match is unfinished, leaving gives no coins or XP and reduces your Honour score by 10. You can start another match afterward. Continue leaving?",
                { title: "Leave match?", confirmText: "Leave match", tone: "warning" }
            );
            confirmingLeave = false;
            if (!confirmed) {
                leaveWarning.hidden = true;
                return;
            }
            ending = true;
            backButton.disabled = true;
            backButton.textContent = "Saving match…";

            try {
                if (gameSessionId) {
                    const response = await fetch(`${window.API_BASE}/game/end`, {
                        method: "POST",
                        credentials: "include",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ session_id: gameSessionId })
                    });
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        throw new Error(data.message || "Match results could not be saved.");
                    }
                    if (data.status === "abandoned") {
                        sessionStorage.setItem("securefps_abandon_notice", data.message || "Unfinished match abandoned. No coins or XP were awarded.");
                    } else if (data.status === "completed") {
                        sessionStorage.setItem("securefps_game_completed", "1");
                    }
                }
                ended = true;
                window.location.href = "player.html#matches";
            } catch (error) {
                gameStatus.style.display = "grid";
                gameStatus.textContent = `${error.message} Your match is saved as in progress.`;
                backButton.disabled = false;
                backButton.textContent = "← Back to dashboard";
                ending = false;
            }
        }

        backButton.addEventListener("click", finishGame);

        window.addEventListener("beforeunload", (event) => {
            if (!gameSessionId || ended || ending) return;
            event.preventDefault();
            event.returnValue = "Leaving now will abandon this match and forfeit rewards.";
        });

        window.addEventListener("pagehide", () => {
            if (!gameSessionId || ended || ending) return;
            fetch(`${window.API_BASE}/game/end`, {
                method: "POST",
                credentials: "include",
                keepalive: true,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: gameSessionId })
            }).catch(() => {});
        });

        async function loadSecureGame() {
            try {
                const response = await fetch(`${window.API_BASE}/game/start`, {
                    method: "POST",
                    credentials: "include"
                });
                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = "login.html";
                        return;
                    }
                    throw new Error(data.message || `Session request failed (${response.status}).`);
                }

                if (!data.session_id || !data.game_token) {
                    throw new Error("The server did not return secure game session credentials.");
                }
                gameSessionId = data.session_id;

                const gameUrl = new URL("public/games/FPS_Microgame/index.html", window.location.href);
                gameUrl.searchParams.set("session_id", data.session_id);
                gameUrl.searchParams.set("game_token", data.game_token);
                gameFrame.src = gameUrl.toString();
                gameFrame.style.display = "block";
                gameStatus.style.display = "none";
            } catch (error) {
                gameFrame.style.display = "none";
                gameStatus.textContent = `${error.message} Make sure the backend is running and you are logged in.`;
                console.error("[SecureFPS] Could not start game session:", error);
            }
        }

        const apiScript = document.createElement("script");
        const configScript = document.createElement("script");
        configScript.src = "js/config.js";
        configScript.onload = () => {
            apiScript.src = "js/api.js";
        };
        configScript.onerror = () => {
            gameStatus.textContent = "The game service configuration could not be loaded. Return to the dashboard and try again.";
        };
        document.head.appendChild(configScript);
        apiScript.onload = () => loadSecureGame();
        apiScript.onerror = () => {
            gameStatus.textContent = "The game service configuration could not be loaded. Return to the dashboard and try again.";
        };
        configScript.addEventListener("load", () => document.head.appendChild(apiScript), { once: true });
        gameFrame.style.display = "none";
    </script>

</body>
</html>
