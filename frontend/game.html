<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FPS Microgame | Secure FPS Platform</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080b10;
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            background: #11161d;
            border-bottom: 1px solid #252c35;
        }

        .header h2 {
            margin: 0;
        }

        .back-button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        .game-wrapper {
            width: 100%;
            height: calc(100vh - 70px);
            padding: 15px;
        }

        .game-container {
            width: 100%;
            height: 100%;
            background: black;
            border-radius: 10px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>🎮 FPS Microgame</h2>

        <button class="back-button"
                onclick="window.location.href='dashboard.html'">
            ← Dashboard
        </button>
    </div>

    <div class="game-wrapper">
        <div class="game-container">

            <iframe
                src="public/games/fps-microgame/index.html"
                allow="fullscreen">
            </iframe>

        </div>
    </div>

</body>
</html>
