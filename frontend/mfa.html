<!doctype html>
<html lang="en">
<head>
  <script>if (["3000", "5500"].includes(window.location.port)) { window.location.replace("http://127.0.0.1:5000/login.html"); }</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SecureFPS | MFA Verification</title>
  <link rel="icon" type="image/svg+xml" href="public/securefps-mark.svg?v=2">
  <link rel="stylesheet" href="css/styles.css?v=20261114_0415">
  <link rel="stylesheet" href="css/ui-polish.css?v=20261114_0415">
</head>
<body class="auth-page mfa-page">
  <main class="auth-shell single">
    <section class="auth-card mfa-card">
      <div class="auth-logo-lockup">
        <img class="brand-lockup securefps-auth-mark" src="public/securefps-mark.svg?v=2" alt="SecureFPS">
      </div>
      <p class="eyebrow">SECOND FACTOR</p>
      <h2>Verify your identity</h2>
      <p>Enter the 6-digit code from your authenticator app.</p>
      <form id="mfaForm" class="form">
        <label>Authentication code
          <input id="code" class="otp-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="000000">
        </label>
        <button class="primary-btn" type="submit">Verify & enter dashboard <span>→</span></button>
      </form>
      <details>
        <summary>Use a recovery code</summary>
        <form id="recoveryForm" class="form">
          <label>Recovery code
            <input name="code" autocomplete="off" spellcheck="false" maxlength="35" required>
          </label>
          <button class="primary-btn" type="submit">Verify recovery code</button>
        </form>
      </details>
      <div id="message" class="message" aria-live="polite"></div>
      <a class="text-link" href="login.html">Back to login</a>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mfa.js"></script>
</body>
</html>
