<!doctype html>
<html lang="en">
<head>
  <script>if (window.location.port !== "5000" && window.location.port !== "") { window.location.replace("http://127.0.0.1:5000/login.html"); }</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SecureFPS | MFA Verification</title>
  <link rel="icon" type="image/svg+xml" href="public/securefps-mark.svg?v=2">
  <link rel="stylesheet" href="css/styles.css?v=20261114_0345">
  <link rel="stylesheet" href="css/ui-polish.css?v=20261114_0345">
</head>
<body class="auth-page mfa-page">
  <main class="auth-shell single">
    <section class="auth-card mfa-card">
      <div class="auth-logo-lockup">
        <img class="brand-lockup" src="public/securefps-logo-crop.png?v=1" alt="SecureFPS Gaming Security">
      </div>
      <p class="eyebrow">SECOND FACTOR</p>
      <h2>Verify your identity</h2>
      <p>Enter the 6-digit code from your authenticator app.</p>
      <div style="margin: 0 0 16px; padding: 8px 12px; background: #F5F3FF; border: 1px solid #DDD6FE; border-radius: 8px; font-size: 12px; color: #5B21B6; display: flex; align-items: center; justify-content: space-between;">
        <span>🔑 Local Testing / Dev Code:</span>
        <strong style="font-family: monospace; letter-spacing: 2px; font-size: 13px; color: #4338CA;">123456</strong>
      </div>
      <form id="mfaForm" class="form">
        <label>Authentication code
          <input id="code" class="otp-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="000000">
        </label>
        <button class="primary-btn" type="submit">Verify & enter dashboard <span>→</span></button>
      </form>
      <div id="message" class="message" aria-live="polite"></div>
      <a class="text-link" href="login.html">Back to login</a>
      <div style="margin-top:16px; border-top:1px solid #E2E8F0; padding-top:12px; font-size:12px;">
        <button type="button" id="toggleSyncBtn" style="background:none; border:none; cursor:pointer; color:#7C3AED; font-weight:600; font-size:12px;">📱 Re-sync Authenticator App / Scan QR</button>
        <div id="syncBox" style="display:none; margin-top:10px; background:#F5F3FF; border:1px solid #DDD6FE; border-radius:10px; padding:12px; text-align:center;">
          <p style="margin:0 0 8px; color:#4C1D95; font-size:11px;">Scan this QR code in Google Authenticator or enter the manual key:</p>
          <img id="mfaQrImg" src="" alt="MFA QR Code" style="width:130px; height:130px; margin:0 auto 8px; display:block; border-radius:6px; background:#fff; padding:6px; border:1px solid #C4B5FD;">
          <p style="margin:0; font-size:11px; color:#6B7280;">Manual Secret Key: <strong id="mfaSecretText" style="color:#1E1B4B; letter-spacing:1px; word-break:break-all;">JBSWY3DPEHPK3PXP</strong></p>
          <p style="margin:6px 0 0; font-size:11px; color:#7C3AED;">Development Master Code: <strong>123456</strong></p>
        </div>
      </div>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mfa.js"></script>
</body>
</html>
